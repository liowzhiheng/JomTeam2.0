name: Deploy JomTeam to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
      - name: Start test database
        run: supabase db start
      - name: Test database migrations and policies
        run: supabase test db
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Configure production environment
        run: npm run configure:production
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Build
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/jomteam-app/browser
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
