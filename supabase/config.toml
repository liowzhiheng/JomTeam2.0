project_id = "jomteam-local"
[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "https://liowzhiheng.github.io/JomTeam2.0/"
additional_redirect_urls = ["http://localhost:4200/**", "http://127.0.0.1:4200/**", "https://liowzhiheng.github.io/JomTeam2.0/**"]
enable_signup = true
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
[storage]
enabled = true
file_size_limit = "5MiB"
[realtime]
enabled = true
[edge_runtime]
enabled = true
policy = "per_worker"
[functions.admin-users]
verify_jwt = true
[functions.delete-account]
verify_jwt = true
